<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#e6edf3"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;900 0;900 0" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="258" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="80" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="300" letter-spacing="2" fill="url(#shine)">Freakah</text>
  <line x1="80" y1="170" x2="80" y2="170" stroke="#e6edf3" stroke-width="2">
    <animate attributeName="x2" from="80" to="140" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </line>
  <text x="80" y="205" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="18" letter-spacing="1" fill="#7d8590">github.com/Freakah<tspan fill="#e6edf3">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></tspan></text>
</svg>
